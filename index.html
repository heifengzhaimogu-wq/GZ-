<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>广州房源报价准确管理</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#182339;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102b49;color:white;padding:22px max(20px,calc((100vw - 1200px)/2))}h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#bfd2e8}main{max-width:1200px;margin:auto;padding:22px}.card{background:white;border:1px solid #e3e8f0;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 22px #102b4909}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#edf4ff;border-radius:12px;padding:16px}.metric strong{display:block;font-size:27px;color:#114b86}.metric span{font-size:13px;color:#53647a}label{display:block;font-size:13px;color:#53647a;margin-bottom:5px}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;background:white}button{border:0;border-radius:9px;background:#1263aa;color:white;padding:11px 16px;cursor:pointer}button.secondary{background:#e9eef5;color:#1d3552}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>*{flex:1}.muted{color:#68768a;font-size:13px}.error{color:#b42318}.success{color:#067647}.hidden{display:none!important}.properties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.property{border:1px solid #e4e9f0;border-radius:12px;padding:16px}.property h3{margin:0 0 5px;font-size:17px}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2f6;color:#45566a;font-size:12px}.price{font-size:22px;font-weight:700;margin:10px 0}.blank{color:#b42318}.property .row{margin-top:12px}.group{display:flex;align-items:center;gap:10px;border-top:1px solid #edf0f4;padding:10px 0}.bar{height:8px;background:#e5ebf2;border-radius:8px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:#2474b9}.group b{min-width:90px}.group small{min-width:90px;text-align:right}.notice-preview{border:1px solid #d7e4f2;border-radius:14px;background:#f8fbff;padding:18px;margin:16px 0;overflow:auto}.notice-preview h3{margin:0 0 5px}.notice-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.notice-stats div{background:#fff;border-radius:10px;padding:12px}.notice-stats strong{display:block;font-size:22px;color:#114b86}.notice-stats span{font-size:12px;color:#53647a}.notice-table{width:100%;border-collapse:collapse;min-width:520px}.notice-table th,.notice-table td{padding:9px;border-bottom:1px solid #dfe7f1;text-align:left;font-size:13px}.notice-table th{color:#53647a}.notice-actions{display:flex;gap:10px;flex-wrap:wrap}.notice-actions button{flex:1;min-width:140px}@media(max-width:720px){header{padding:20px}main{padding:12px}.grid,.metrics,.properties{grid-template-columns:1fr 1fr}.row{display:block}.row>*{margin:8px 0}.property{grid-column:span 2}.notice-stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.metrics{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>广州房源报价准确管理</h1><p>逐套确认系统报价 · 门店与小组进度 · 系统复导核验</p></header>
<main>
<section id="login" class="card">
<h2>进入我的工作台</h2><p class="muted">选择门店和岗位，输入工号后四位。页面只展示名单匹配出的范围。</p>
<div class="grid"><div><label>门店</label><select id="store"><option value="">请选择门店</option></select></div><div><label>岗位</label><select id="role"><option value="">请选择岗位</option><option value="advisor">豪宅顾问</option><option value="manager">店经理</option><option value="store_lead">店总</option><option value="bp">BP</option></select></div><div><label>工号后四位</label><input id="last4" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="例如 0035"></div></div>
<p><button id="enter">进入工作台</button></p>
<details><summary>总管理员邮箱验证</summary><p class="muted">只有全公司管理员使用此入口。</p><div class="row"><input id="adminEmail" type="email" placeholder="管理员邮箱"><button id="sendLink">发送登录邮件</button></div></details>
<p id="loginMessage" class="muted"></p>
</section>
<section id="workspace" class="hidden">
<div class="card row"><div><h2 id="welcome" style="margin:0"></h2><span id="scope" class="muted"></span></div><button id="logout" class="secondary" style="flex:0">退出</button></div>
<div id="metrics" class="metrics"></div>
<section class="card"><h2>门店进度</h2><div id="groups"></div><h2>小组进度</h2><div id="teams"></div></section>
<section class="card"><h2>微信群公示信息包</h2><p class="muted">全司版展示门店和小组；店面版展示小组和个人。仅公示数量、核查进展及比例，不展示逐套报价。</p><label for="noticeScope">公示范围</label><select id="noticeScope"></select><div id="noticePreview" class="notice-preview"></div><div class="notice-actions"><button id="copyNotice">复制群公告文案</button><button id="copyImage" class="secondary">复制图片</button><button id="saveImage" class="secondary">下载海报 PNG</button></div><p id="noticeMessage" class="muted"></p></section>
<section id="admin" class="card hidden"><h2>管理员导入</h2><p class="muted">Excel 或 CSV 在本机解析，只提交工作台所需字段；原始文件不会保存在服务器。支持列名：房源编号、店面、店组、房源维护人、项目、租售类型、报价。</p><input id="upload" type="file" accept=".xlsx,.xls,.csv,text/csv"><p id="importMessage" class="muted"></p></section>
<section class="card"><h2>逐套核查</h2><div class="grid"><div><label>门店</label><select id="filterStore"><option value="">全部可见门店</option></select></div><div><label>小组</label><select id="filterTeam"><option value="">全部可见小组</option></select></div><div><label>搜索房源／维护人</label><input id="search" placeholder="输入房源编号、项目或姓名"></div></div><p id="listCount" class="muted"></p><div id="properties" class="properties"></div></section>
</section>
</main>
<script src="vendor/xlsx.full.min.js"></script>
<script>
const base="https://rpesjrniuxxjvaxnmjqq.supabase.co",api=base+"/functions/v1/workbench",publishable="sb_publishable_jxBFQma5_vfdL9aAetkk7Q_YxlUwQ-G";
const stores=["誉峰观园店","汇悦台店","保利天悦店","嘉裕公馆店","凯旋新世界店","珠江新城旗舰店"];
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token=localStorage.getItem("gz_price_token")||"",name=localStorage.getItem("gz_price_name")||"",role=localStorage.getItem("gz_price_role")||"",rows=[],summary=null;
$("store").innerHTML+=stores.map(s=>'<option>'+s+"</option>").join("");
async function call(action,body={},auth=token){const r=await fetch(api,{method:"POST",headers:{"content-type":"application/json",apikey:publishable,...(auth?{authorization:"Bearer "+auth}:{})},body:JSON.stringify({action,...body})});const d=await r.json();if(!r.ok)throw Error(d.error||"请求失败");return d}
function message(id,s,bad=false){$(id).textContent=s;$(id).className=bad?"error":"success"}
function session(d){token=d.token;name=d.name;role=d.role;localStorage.setItem("gz_price_token",token);localStorage.setItem("gz_price_name",name);localStorage.setItem("gz_price_role",role);show()}
$("enter").onclick=async()=>{try{const d=await call("login",{store:$("store").value,role:$("role").value,last4:$("last4").value},"");session(d)}catch(e){message("loginMessage","无法进入："+e.message,true)}};
$("sendLink").onclick=async()=>{const email=$("adminEmail").value.trim();if(!email)return message("loginMessage","请填写邮箱",true);const button=$("sendLink");button.disabled=true;try{const redirect=location.protocol==="file:"?"http://localhost:3000/":location.origin+location.pathname;const r=await fetch(base+"/auth/v1/otp?redirect_to="+encodeURIComponent(redirect),{method:"POST",headers:{"content-type":"application/json",apikey:publishable},body:JSON.stringify({email,create_user:false})});const d=await r.json().catch(()=>({}));const reason=d.msg||d.message||d.error_description||d.error_code||r.status;message("loginMessage",r.ok?"已发送验证邮件，请从邮件打开链接":String(reason).includes("rate limit")?"邮件发送额度已用完，请稍后再试。":"发送失败："+reason,!r.ok)}catch(e){message("loginMessage","发送失败："+e.message,true)}finally{setTimeout(()=>button.disabled=false,60000)}};
async function ownerCallback(){const h=new URLSearchParams(location.hash.slice(1)),access=h.get("access_token");if(!access){if(h.get("error"))message("loginMessage","管理员链接无效或已失效："+(h.get("error_description")||h.get("error_code")||h.get("error")),true);return}history.replaceState(null,"",location.pathname);try{session(await call("owner_login",{},access))}catch(e){message("loginMessage","管理员验证失败："+e.message,true)}}
async function show(){if(!token)return;$("login").classList.add("hidden");$("workspace").classList.remove("hidden");$("welcome").textContent=name+"的工作台";$("scope").textContent=role==="owner"?"全公司总管理员":({bp:"BP",store_lead:"店总",manager:"店经理",advisor:"豪宅顾问"}[role]||"");$("admin").classList.toggle("hidden",role!=="owner");await refresh()}
async function refresh(){try{const [a,b]=await Promise.all([call("list"),call("summary")]);rows=a.rows;summary=b;render()}catch(e){if(e.message==="session_expired"){$("logout").click();return}alert("加载失败："+e.message)}}
function render(){let total=summary.total,done=summary.stores.reduce((n,x)=>n+x.accurate,0),needs=summary.stores.reduce((n,x)=>n+x.needs_change,0),blanks=summary.stores.reduce((n,x)=>n+x.blank_price,0);$("metrics").innerHTML=[["可见房源",total],["已确认准确",done],["需修改",needs],["系统未填报价",blanks]].map(x=>'<div class="metric"><strong>'+x[1]+'</strong><span>'+x[0]+"</span></div>").join("");const groupHtml=x=>'<div class="group"><b>'+esc(x.name)+'</b><div class="bar"><i style="width:'+(x.total?Math.round(x.accurate/x.total*100):0)+'%"></i></div><small>'+x.accurate+'/'+x.total+" 已确认</small></div>";$("groups").innerHTML=summary.stores.map(groupHtml).join("");$("teams").innerHTML=summary.teams.map(groupHtml).join("");const ss=[...new Set(rows.map(x=>x.store_name))].sort(),ts=[...new Set(rows.map(x=>x.team_name).filter(Boolean))].sort();let oldS=$("filterStore").value,oldT=$("filterTeam").value;$("filterStore").innerHTML='<option value="">全部可见门店</option>'+ss.map(x=>'<option>'+esc(x)+"</option>").join("");$("filterTeam").innerHTML='<option value="">全部可见小组</option>'+ts.map(x=>'<option>'+esc(x)+"</option>").join("");$("filterStore").value=oldS;$("filterTeam").value=oldT;renderList();renderNotice()}
function renderList(){let s=$("filterStore").value,t=$("filterTeam").value,q=$("search").value.trim();let visible=rows.filter(x=>(!s||x.store_name===s)&&(!t||x.team_name===t)&&(!q||[x.property_code,x.estate_name,x.owner_name].some(y=>String(y||"").includes(q))));$("listCount").textContent="显示 "+visible.length+" 套";$("properties").innerHTML=visible.slice(0,100).map(x=>{let status=x.check?.asking_status||"";return '<div class="property"><h3>'+esc(x.estate_name||"未填项目")+'</h3><span class="tag">'+esc(x.store_name)+" · "+esc(x.team_name)+'</span><p class="muted">'+esc(x.property_code)+" · 维护人："+esc(x.owner_name)+'</p><div class="price '+(x.system_asking_price===null?"blank":"")+'">系统报价：'+(x.system_asking_price===null?"未填":esc(x.system_asking_price))+'</div><div class="row"><select data-code="'+esc(x.property_code)+'"><option value="">待核查</option><option value="accurate" '+(status==="accurate"?"selected":"")+'>最新准确</option><option value="needs_change" '+(status==="needs_change"?"selected":"")+'>需修改</option><option value="owner_pending" '+(status==="owner_pending"?"selected":"")+'>待业主确认</option></select></div></div>'}).join("")+(visible.length>100?'<p class="muted">当前仅显示前100套，请继续筛选。</p>':"")}
$("properties").onchange=async e=>{const el=e.target;if(!el.dataset.code||!el.value)return;try{await call("review",{property_code:el.dataset.code,status:el.value});await refresh()}catch(x){alert("保存失败："+x.message)}};
["filterStore","filterTeam","search"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",renderList));
$("logout").onclick=()=>{["gz_price_token","gz_price_name","gz_price_role"].forEach(x=>localStorage.removeItem(x));location.reload()};
const pct=(n,d)=>d?Math.round(n/d*100)+"%":"0%";
function stats(list){const x={total:list.length,accurate:0,needs:0,ownerPending:0,blank:0,unchecked:0,checked:0};for(const r of list){const s=r.check?.asking_status;if(s==="accurate")x.accurate++;else if(s==="needs_change")x.needs++;else if(s==="owner_pending")x.ownerPending++;else x.unchecked++;if(r.system_asking_price===null)x.blank++}x.checked=x.total-x.unchecked;return x}
function grouped(list,key,label){const map=new Map();for(const r of list){const k=key(r),bucket=map.get(k)||{name:label(r),rows:[]};bucket.rows.push(r);map.set(k,bucket)}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"zh-CN")).map(g=>({name:g.name,...stats(g.rows)}))}
function noticeData(){
  const key=$("noticeScope").value,parts=key.split("::"),type=parts[0],name=parts.slice(1).join("::");
  const selected=type==="store"?rows.filter(x=>x.store_name===name):type==="team"?rows.filter(x=>x.team_name===name):rows;
  const label=$("noticeScope").selectedOptions[0]?.textContent||"我的范围",sections=[];
  const add=(title,getKey,getLabel)=>sections.push({title,rows:grouped(selected,getKey,getLabel)});
  const store=()=>add("门店汇总",r=>r.store_name||"未分店",r=>r.store_name||"未分店");
  const team=()=>add("小组汇总",r=>r.team_name||"未分组",r=>r.team_name||"未分组");
  const person=()=>add("个人汇总",r=>(r.owner_employee_code||r.owner_name||"未填维护人")+"|"+(r.team_name||""),r=>(r.owner_name||"未填维护人")+(r.team_name?" · "+r.team_name.replace(r.store_name||"",""):""));
  if(type==="all"&&(role==="owner"||role==="bp")){store();team()}
  else if(type==="store"||type==="all"&&role==="store_lead"){team();person()}
  else if(type==="team"||type==="all"&&role==="manager")person();
  return{label,totals:stats(selected),sections,date:new Date().toLocaleString("zh-CN",{hour12:false})};
}
function renderNotice(){
  const sel=$("noticeScope"),old=sel.value,stores=[...new Set(rows.map(x=>x.store_name))].sort(),teams=[...new Set(rows.map(x=>x.team_name).filter(Boolean))].sort(),options=[];
  if(role==="owner")options.push(["all","全公司"]);else if(role==="bp"&&stores.length>1)options.push(["all","负责门店合计"]);else if(role==="advisor")options.push(["all","我名下房源"]);else if(role==="manager")options.push(["all","我的小组"]);else if(role==="store_lead")options.push(["all","我的门店"]);
  for(const s of stores)if(role==="owner"||role==="bp"||role==="store_lead")options.push(["store::"+s,s]);
  for(const t of teams)if(role==="owner"||role==="bp"||role==="store_lead"||role==="manager")options.push(["team::"+t,t]);
  sel.replaceChildren(...options.map(([v,label])=>new Option(label,v)));if(options.some(x=>x[0]===old))sel.value=old;
  const d=noticeData(),m=d.totals,cells=[["房源总量",m.total],["已完成核查",m.checked+" · "+pct(m.checked,m.total)],["最新准确",m.accurate+" · "+pct(m.accurate,m.total)],["需修改",m.needs],["待业主确认",m.ownerPending],["系统未填报价",m.blank]];
  const tables=d.sections.map(section=>"<h4>"+esc(section.title)+"</h4><table class='notice-table'><thead><tr><th>范围</th><th>房源</th><th>已核查</th><th>核查率</th><th>准确</th><th>需修改</th><th>未填报价</th></tr></thead><tbody>"+section.rows.map(g=>"<tr><td>"+esc(g.name)+"</td><td>"+g.total+"</td><td>"+g.checked+"</td><td>"+pct(g.checked,g.total)+"</td><td>"+g.accurate+"</td><td>"+g.needs+"</td><td>"+g.blank+"</td></tr>").join("")+"</tbody></table>").join("");
  $("noticePreview").innerHTML="<h3>广州房源报价核查公示 · "+esc(d.label)+"</h3><p class='muted'>更新于 "+esc(d.date)+" · 未核查 "+m.unchecked+" 套</p><div class='notice-stats'>"+cells.map(([label,value])=>"<div><strong>"+esc(value)+"</strong><span>"+esc(label)+"</span></div>").join("")+"</div>"+tables+"<p class='muted'>已确认准确的房源无需重复催办；请优先处理需修改和系统未填报价的房源。</p>";
}
function notice(){const d=noticeData(),m=d.totals;const sections=d.sections.map(section=>"\n【"+section.title+"】\n"+section.rows.map(g=>g.name+"："+(section.title==="个人汇总"?"名下 ":"房源 ")+g.total+" 套，已核查 "+g.checked+"（"+pct(g.checked,g.total)+"），准确 "+g.accurate+"，需改 "+g.needs+"，未填报价 "+g.blank).join("\n")).join("");return "【广州房源报价核查公示｜"+d.label+"】\n截至 "+d.date+"，共 "+m.total+" 套房源；已核查 "+m.checked+" 套（"+pct(m.checked,m.total)+"），其中最新准确 "+m.accurate+" 套（占全部 "+pct(m.accurate,m.total)+"），需修改 "+m.needs+" 套，待业主确认 "+m.ownerPending+" 套；尚未核查 "+m.unchecked+" 套，系统未填报价 "+m.blank+" 套。"+sections+"\n请责任人优先核对未核查、需修改及系统未填报价的房源；已确认最新准确的房源无需重复推动。"}
function poster(){
  const d=noticeData(),m=d.totals,canvas=document.createElement("canvas"),c=canvas.getContext("2d");
  canvas.width=1080;canvas.height=680+d.sections.reduce((n,s)=>n+120+s.rows.length*62,0);
  c.fillStyle="#f5f8fc";c.fillRect(0,0,1080,canvas.height);c.fillStyle="#102b49";c.fillRect(0,0,1080,165);
  c.fillStyle="white";c.font="bold 44px sans-serif";c.fillText("广州房源报价核查公示",54,77);
  c.font="25px sans-serif";c.fillText(d.label+"  ·  "+d.date,56,125,960);
  const items=[["房源总量",m.total],["已核查",m.checked+" / "+m.total],["核查完成率",pct(m.checked,m.total)],["最新准确",m.accurate+" · "+pct(m.accurate,m.total)],["需修改",m.needs],["系统未填报价",m.blank]];
  items.forEach(([label,value],i)=>{const x=54+(i%3)*330,y=195+Math.floor(i/3)*135;c.fillStyle="white";c.fillRect(x,y,310,115);c.fillStyle="#53647a";c.font="22px sans-serif";c.fillText(label,x+20,y+34);c.fillStyle="#114b86";c.font="bold 39px sans-serif";c.fillText(String(value),x+20,y+86,275)});
  let y=495;
  for(const section of d.sections){
    c.fillStyle="#102b49";c.font="bold 27px sans-serif";c.fillText(section.title,54,y);y+=42;
    c.fillStyle="#dbe7f4";c.fillRect(54,y,972,48);c.fillStyle="#314761";c.font="20px sans-serif";
    [["范围",70],["房源",375],["已核查",480],["核查率",605],["准确",740],["需改",855],["未填",965]].forEach(([t,x])=>c.fillText(t,x,y+32));y+=48;
    section.rows.forEach((g,i)=>{c.fillStyle=i%2?"#fff":"#edf3fa";c.fillRect(54,y+i*62,972,62);c.fillStyle="#20344f";c.font="21px sans-serif";[[g.name,70],[g.total,375],[g.checked,480],[pct(g.checked,g.total),605],[g.accurate,740],[g.needs,855],[g.blank,965]].forEach(([t,x],j)=>c.fillText(String(t),x,y+i*62+40,j?95:285))});
    y+=section.rows.length*62+30;
  }
  c.fillStyle="#52657d";c.font="21px sans-serif";c.fillText("已确认准确无需重复催办  ·  优先处理需修改与未填报价",54,canvas.height-65,960);return canvas;
}
$("noticeScope").onchange=renderNotice;
$("copyNotice").onclick=async()=>{try{await navigator.clipboard.writeText(notice());message("noticeMessage","公示文案已复制，可直接粘贴到微信群。") }catch(e){message("noticeMessage","复制失败，请检查浏览器剪贴板权限。",true)}};
$("copyImage").onclick=async()=>{try{const blob=await new Promise(ok=>poster().toBlob(ok,"image/png"));if(!blob||!navigator.clipboard.write||!window.ClipboardItem)throw Error("clipboard_unavailable");await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);message("noticeMessage","海报图片已复制，可直接粘贴到微信群。") }catch(e){message("noticeMessage","浏览器未允许复制图片，请使用“下载海报 PNG”。",true)}};
$("saveImage").onclick=async()=>{const blob=await new Promise(ok=>poster().toBlob(ok,"image/png"));if(!blob)return message("noticeMessage","图片生成失败",true);const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="广州房源报价公示-"+noticeData().label+".png";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message("noticeMessage","海报已下载，可直接发到微信群。")};
function parseCSV(text){let lines=[],row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===","&&!quoted){row.push(cell);cell=""}else if((ch==="\n"||ch==="\r")&&!quoted){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(Boolean))lines.push(row);row=[];cell=""}else cell+=ch}row.push(cell);if(row.some(Boolean))lines.push(row);return lines}
$("upload").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{let csv;if(/\.xlsx?$/i.test(file.name)){if(!window.XLSX)throw Error("Excel 解析组件未加载");const book=XLSX.read(await file.arrayBuffer(),{type:"array"});csv=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:""})}else csv=parseCSV(await file.text());const headers=csv.shift().map(x=>String(x).replace(/^\uFEFF/,"").trim()),index=k=>headers.indexOf(k);if(index("房源编号")<0||index("店面")<0||index("报价")<0)throw Error("缺少房源编号、店面或报价列");const seen=new Set(),data=[],errors=[];for(let i=0;i<csv.length;i++){const r=csv[i],v=k=>String(r[index(k)]??""),code=v("房源编号").trim(),source=v("店面").trim(),team=v("店组").trim();if(!code||!source){errors.push("第"+(i+2)+"行缺少编号或门店");continue}if(source==="中海花城湾店"||seen.has(code))continue;seen.add(code);const store=source==="一大区"?(team.match(/^.+?店/)||[])[0]:source,price=v("报价").trim();if(!store||price&&!Number.isFinite(Number(price))){errors.push("第"+(i+2)+"行门店或报价无效");continue}data.push({property_code:code,store_name:store,source_store_name:source,team_name:team,owner_name:v("房源维护人"),owner_employee_code:null,estate_name:v("项目"),listing_type:v("租售类型"),system_asking_price:price===""?null:Number(price)})}if(errors.length)throw Error(errors.slice(0,5).join("；"));message("importMessage","已核对 "+data.length+" 套，正在导入……");for(let i=0;i<data.length;i+=200)await call("import",{rows:data.slice(i,i+200)});message("importMessage","导入完成："+data.length+" 套；原始文件未保存。");await refresh()}catch(x){message("importMessage","导入失败："+x.message,true)}e.target.value=""};
